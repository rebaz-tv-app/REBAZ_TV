<!DOCTYPE html>
<html lang="ku" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REBAZ TV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f0c1b; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Header Top Bar */
    .header { height: 50px; background: #18132b; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #2a2444; }
    .header-left { display: flex; align-items: center; gap: 15px; font-size: 20px; font-weight: bold; }
    .search-box { background: #251f3d; border-radius: 20px; padding: 5px 15px; display: flex; align-items: center; width: 300px; }
    .search-box input { background: transparent; border: none; color: #fff; width: 100%; outline: none; margin-left: 8px; }

    /* Layout Container */
    .main-container { flex: 1; display: flex; overflow: hidden; }

    /* Column 1: Categories (پانییەکەی بچووک کرایەوە) */
    .sidebar-categories { width: 190px; background: #141024; border-right: 1px solid #2a2444; padding: 15px; }
    .cat-search { background: #251f3d; border: 1px solid #3d345e; color: #fff; width: 100%; padding: 8px; border-radius: 4px; margin-bottom: 15px; }
    .cat-item { display: flex; justify-content: space-between; padding: 10px 12px; border: 1px solid #2a2444; margin-bottom: 8px; border-radius: 4px; cursor: pointer; color: #ccc; outline: none; }
    .cat-item.active, .cat-item:hover, .cat-item:focus { background: #251f3d; border-color: #ffde03; color: #ffde03; }

    /* Column 2: Channel List (پانییەکەی بچووک کرایەوە) */
    .channel-list { width: 240px; background: #18132b; border-right: 1px solid #2a2444; padding: 15px; overflow-y: auto; }
    .channel-item { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #2a2444; margin-bottom: 10px; border-radius: 4px; cursor: pointer; background: #1f1938; outline: none; }
    .channel-item.active, .channel-item:hover, .channel-item:focus { border-color: #ffde03; background: #2b234d; }
    .channel-num { font-weight: bold; font-size: 16px; width: 20px; }
    .channel-icon { width: 24px; height: 16px; background: #fff; border-radius: 2px; }

    /* Column 3: Video Player */
    .player-section { flex: 1; background: #0f0c1b; padding: 20px; display: flex; flex-direction: column; }
    .video-wrapper { width: 100%; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; max-height: 65vh; position: relative; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .current-title { font-size: 22px; font-weight: bold; margin-top: 15px; color: #fff; }
    
    /* Favorite Button Styles */
    .player-controls-bottom { margin-top: 15px; }
    .fav-btn { background: transparent; border: none; color: #aaa; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; outline: none; padding: 5px 0; }
    .fav-btn:hover, .fav-btn:focus { color: #fff; }
    .fav-btn.active { color: #e91e63; /* ڕەنگی پەمەیی/سوور کاتێک دڵخوازە */ }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <span>&lt;</span>
      <span>REBAZ TV</span>
    </div>
    <div class="search-box">
      <input type="text" placeholder="Search">
    </div>
  </div>

  <div class="main-container">
    
    <div class="sidebar-categories">
      <input type="text" class="cat-search" placeholder="Search in categories">
      <div class="cat-item active" tabindex="0" onclick="setCategory('all', this)"><span>All</span><span id="countAll">3</span></div>
      <div class="cat-item" tabindex="0" onclick="setCategory('favorite', this)"><span>Favorite</span><span id="countFav">0</span></div>
      <div class="cat-item" tabindex="0" onclick="setCategory('general', this)"><span>General</span><span id="countGen">3</span></div>
    </div>

    <div class="channel-list" id="channelList"></div>

    <div class="player-section">
      <div class="video-wrapper" id="videoWrapper">
        <video id="video" controls autoplay></video>
      </div>
      <div class="current-title" id="activeTitle">1. Demo live 3</div>
      <div class="player-controls-bottom">
        <!-- دوگمەی دڵخوازەکان -->
        <button id="favBtn" class="fav-btn" onclick="toggleFavorite()">♡ Favorite</button>
      </div>
    </div>

  </div>

  <script>
    const channels = [
      { id: 1, name: "Demo live 3", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
      { id: 2, name: "Demo live 2", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
      { id: 3, name: "Demo live 1", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }
    ];

    const video = document.getElementById('video');
    const channelListEl = document.getElementById('channelList');
    const activeTitleEl = document.getElementById('activeTitle');
    const favBtn = document.getElementById('favBtn');
    
    let hls = null;
    let activeChannelId = null;
    let currentCategory = 'all';

    // هێنانەوەی لیستی دڵخوازەکان لە بیرگەی ئامێرەکە (ئەگەر هەبێت)
    let favorites = JSON.parse(localStorage.getItem('rebazTvFavs')) || [];

    // نوێکردنەوەی ژمارەی پاکێجەکان
    function updateCategoryCounts() {
      document.getElementById('countAll').textContent = channels.length;
      document.getElementById('countGen').textContent = channels.length;
      document.getElementById('countFav').textContent = favorites.length;
    }

    // گۆڕینی پاکێجەکان (All, Favorite)
    function setCategory(cat, element) {
      currentCategory = cat;
      document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');
      renderChannels();
    }

    // دروستکردنی لیستی کەناڵەکان بەپێی پاکێجەکە
    function renderChannels() {
      channelListEl.innerHTML = '';
      
      let filteredChannels = channels;
      if (currentCategory === 'favorite') {
        filteredChannels = channels.filter(ch => favorites.includes(ch.id));
      }

      if (filteredChannels.length === 0) {
        channelListEl.innerHTML = '<div style="padding:15px;color:#aaa;text-align:center;">No channels found</div>';
        return;
      }

      filteredChannels.forEach((ch, index) => {
        const item = document.createElement('div');
        // هێشتنەوەی دیاریکردنی کەناڵی ئاکتیڤ
        item.className = `channel-item ${activeChannelId === ch.id ? 'active' : ''}`;
        item.tabIndex = 0;

        item.onclick = () => handleChannelSelection(ch, item);
        item.onkeydown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleChannelSelection(ch, item);
          }
        };

        item.innerHTML = `
          <span class="channel-num">${ch.id}</span>
          <span class="channel-icon"></span>
          <span>${ch.name}</span>
        `;
        channelListEl.appendChild(item);
      });
    }

    function handleChannelSelection(channel, element) {
      if (activeChannelId === channel.id) {
        toggleFullScreen();
      } else {
        playChannel(channel, element);
      }
    }

    function playChannel(channel, element) {
      activeChannelId = channel.id;
      
      // نوێکردنەوەی ڕەنگی کەناڵی دیاریکراو
      document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');
      activeTitleEl.textContent = `${channel.id}. ${channel.name}`;

      // پشکنین کە ئایا ئەم کەناڵە دڵخوازە یان نا بۆ گۆڕینی شێوەی دوگمەکە
      checkFavoriteStatus();

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(channel.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = channel.url;
        video.play();
      }
    }

    // زیادکردن و سڕینەوە لە لیستی دڵخوازەکان
    function toggleFavorite() {
      if (!activeChannelId) return;

      if (favorites.includes(activeChannelId)) {
        favorites = favorites.filter(id => id !== activeChannelId);
      } else {
        favorites.push(activeChannelId);
      }
      
      // پاشەکەوتکردنی لە مۆبایل/تیڤیەکە
      localStorage.setItem('rebazTvFavs', JSON.stringify(favorites));
      
      checkFavoriteStatus();
      updateCategoryCounts();

      // ئەگەر لەناو بەشی دڵخوازەکان بووین، با لیستەکە نوێ بێتەوە
      if (currentCategory === 'favorite') {
        renderChannels();
      }
    }

    // گۆڕینی شێوەی دوگمەی Favorite (پڕ و بەتاڵ)
    function checkFavoriteStatus() {
      if (favorites.includes(activeChannelId)) {
        favBtn.innerHTML = '♥ Favorite';
        favBtn.classList.add('active');
      } else {
        favBtn.innerHTML = '♡ Favorite';
        favBtn.classList.remove('active');
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        if (video.requestFullscreen) {
          video.requestFullscreen();
        } else if (video.mozRequestFullScreen) {
          video.mozRequestFullScreen();
        } else if (video.webkitRequestFullscreen) {
          video.webkitRequestFullscreen();
        } else if (video.msRequestFullscreen) {
          video.msRequestFullscreen();
        }
      }
    }

    // کارپێکردنی سەرەتایی
    updateCategoryCounts();
    renderChannels();
    if (channels.length > 0) {
      playChannel(channels[0]);
    }
  </script>
</body>
</html>
