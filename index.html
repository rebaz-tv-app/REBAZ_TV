<!DOCTYPE html>
<html lang="ku" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REBAZ TV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f0c1b; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Header Top Bar */
    .header { height: 50px; background: #18132b; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #2a2444; }
    .header-left { display: flex; align-items: center; gap: 15px; font-size: 20px; font-weight: bold; }
    .search-box { background: #251f3d; border-radius: 20px; padding: 5px 15px; display: flex; align-items: center; width: 300px; }
    .search-box input { background: transparent; border: none; color: #fff; width: 100%; outline: none; margin-left: 8px; }

    /* Layout Container */
    .main-container { flex: 1; display: flex; overflow: hidden; }

    /* Column 1: Categories */
    .sidebar-categories { width: 250px; background: #141024; border-right: 1px solid #2a2444; padding: 15px; }
    .cat-item { display: flex; justify-content: space-between; padding: 10px 12px; border: 1px solid #2a2444; margin-bottom: 8px; border-radius: 4px; cursor: pointer; color: #ccc; outline: none; }
    .cat-item.active, .cat-item:hover, .cat-item:focus { background: #251f3d; border-color: #ffde03; color: #ffde03; }

    /* Column 2: Channel List */
    .channel-list { width: 300px; background: #18132b; border-right: 1px solid #2a2444; padding: 15px; overflow-y: auto; }
    .channel-item { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #2a2444; margin-bottom: 10px; border-radius: 4px; cursor: pointer; background: #1f1938; outline: none; }
    .channel-item.active, .channel-item:hover, .channel-item:focus { border-color: #ffde03; background: #2b234d; }
    .channel-num { font-weight: bold; font-size: 16px; width: 20px; }
    .channel-icon { width: 24px; height: 16px; background: #fff; border-radius: 2px; }

    /* Column 3: Video Player */
    .player-section { flex: 1; background: #0f0c1b; padding: 20px; display: flex; flex-direction: column; }
    .video-wrapper { width: 100%; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; max-height: 65vh; position: relative; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .current-title { font-size: 22px; font-weight: bold; margin-top: 15px; color: #fff; }
    .player-controls-bottom { display: flex; gap: 20px; margin-top: 15px; color: #aaa; font-size: 14px; cursor: pointer; }
    .player-controls-bottom span:hover { color: #ffde03; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <span>&lt;</span>
      <span>REBAZ TV</span>
    </div>
    <div class="search-box">
      <input type="text" placeholder="Search">
    </div>
  </div>

  <div class="main-container">
    
    <div class="sidebar-categories">
      <div class="cat-item active" tabindex="0"><span>All</span><span>3</span></div>
      <div class="cat-item" tabindex="0"><span>Recently Viewed</span><span>1</span></div>
      <div class="cat-item" tabindex="0"><span>Favorite</span><span>0</span></div>
      <div class="cat-item" tabindex="0"><span>General</span><span>3</span></div>
    </div>

    <div class="channel-list" id="channelList"></div>

    <div class="player-section">
      <div class="video-wrapper" id="videoWrapper">
        <video id="video" controls autoplay></video>
      </div>
      <div class="current-title" id="activeTitle">1. Demo live 3</div>
      <div class="player-controls-bottom">
        <span id="favBtn">♡ Favorite</span>
      </div>
    </div>

  </div>

  <script>
    const channels = [
      { id: 1, name: "Demo live 3", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", isFavorite: false },
      { id: 2, name: "Demo live 2", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", isFavorite: false },
      { id: 3, name: "Demo live 1", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", isFavorite: false }
    ];

    const video = document.getElementById('video');
    const channelListEl = document.getElementById('channelList');
    const activeTitleEl = document.getElementById('activeTitle');
    const favBtn = document.getElementById('favBtn');
    let hls = null;
    let activeChannelId = null;

    function renderChannels() {
      channelListEl.innerHTML = '';
      channels.forEach((ch, index) => {
        const item = document.createElement('div');
        item.className = `channel-item ${index === 0 ? 'active' : ''}`;
        item.tabIndex = 0;

        item.onclick = () => handleChannelSelection(ch, item);
        item.onkeydown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleChannelSelection(ch, item);
          }
        };

        item.innerHTML = `
          <span class="channel-num">${ch.id}</span>
          <span class="channel-icon"></span>
          <span>${ch.name}</span>
        `;
        channelListEl.appendChild(item);
      });
    }

    function handleChannelSelection(channel, element) {
      if (activeChannelId === channel.id) {
        toggleFullScreen();
      } else {
        playChannel(channel, element);
      }
    }

    function playChannel(channel, element) {
      activeChannelId = channel.id;
      
      document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');
      activeTitleEl.textContent = `${channel.id}. ${channel.name}`;

      // نوێکردنەوەی دۆخی Favorite بۆ ئەم کەناڵە
      favBtn.textContent = channel.isFavorite ? '❤️ Favorite' : '♡ Favorite';
      favBtn.style.color = channel.isFavorite ? '#ffde03' : '#aaa';

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(channel.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = channel.url;
        video.play();
      }
    }

    // ئیشپێکردنی Favorite
    favBtn.onclick = () => {
        const channel = channels.find(c => c.id === activeChannelId);
        if (channel) {
            channel.isFavorite = !channel.isFavorite;
            favBtn.textContent = channel.isFavorite ? '❤️ Favorite' : '♡ Favorite';
            favBtn.style.color = channel.isFavorite ? '#ffde03' : '#aaa';
        }
    };

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        const wrapper = document.getElementById('videoWrapper');
        if (wrapper.requestFullscreen) wrapper.requestFullscreen();
        else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    renderChannels();
    playChannel(channels[0], document.querySelector('.channel-item'));
  </script>
</body>
</html>
