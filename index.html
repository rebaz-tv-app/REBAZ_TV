<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBAZ TV</title>
    <style>
        body { background: #171321; color: white; font-family: sans-serif; margin: 0; padding: 0; }
        .list-container { padding: 20px; }
        .channel-item { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            cursor: pointer;
            border: 1px solid transparent;
        }
        .channel-item:hover { border-color: yellow; }
        .channel-num { margin-right: 15px; font-weight: bold; color: yellow; }
    </style>
</head>
<body>

    <div class="list-container" id="list">
        <h3>خەریکی بارکردنی کەناڵەکان...</h3>
    </div>

    <script>
        const M3U_URL = "https://raw.githubusercontent.com/rebaz92/Xurmatw/refs/heads/main/xurmatw";

        async function loadChannels() {
            try {
                const response = await fetch(M3U_URL);
                const text = await response.text();
                const lines = text.split('\n');
                const list = document.getElementById('list');
                list.innerHTML = '';

                let count = 1;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF:')) {
                        // دۆزینەوەی ناوی کەناڵ دوای فاریزە
                        let name = lines[i].split(',')[1] || "کەناڵی نەناسراو";
                        let url = lines[i+1] ? lines[i+1].trim() : '';

                        if (url.startsWith('http')) {
                            let div = document.createElement('div');
                            div.className = 'channel-item';
                            div.innerHTML = `<span class="channel-num">${count}</span><span>${name}</span>`;
                            div.onclick = () => {
                                if (typeof AndroidBridge !== 'undefined') {
                                    AndroidBridge.playInExo(url, name);
                                } else {
                                    alert("کەناڵەکە کار ناکات: " + url);
                                }
                            };
                            list.appendChild(div);
                            count++;
                        }
                    }
                }
            } catch (e) {
                document.getElementById('list').innerHTML = "هەڵە لە هێنانی لیستەکە: " + e;
            }
        }
        loadChannels();
    </script>
</body>
</html>
