<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REBAZ TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.3.5/dist/hls.light.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Arabic', sans-serif; }
    body { background-color: #0b1021; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Header (سەرەوە) - ڕێک وەک وێنە کۆنەکە */
    .header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; background: linear-gradient(to bottom, #111832, #0b1021); }
    .logo { font-size: 24px; font-weight: bold; letter-spacing: 1px; color: #fff; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .header-icons { display: flex; gap: 10px; font-size: 18px; cursor: pointer; opacity: 0.8; }
    .search-box { background: #1f2747; border-radius: 20px; padding: 6px 15px; display: flex; align-items: center; width: 220px; border: 1px solid #2a345c; }
    .search-box input { background: transparent; border: none; color: #fff; width: 100%; outline: none; margin-right: 8px; text-align: right; font-size: 14px; }
    .search-box span { font-size: 14px; opacity: 0.7; }

    /* Main Area (ناوەڕاست) */
    .main-content { flex: 1; display: flex; padding: 20px; gap: 20px; height: calc(100vh - 100px); }

    /* ١. بەشی ڕاست: پاکێجەکان (Categories) */
    .categories { width: 220px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    .cat-item { padding: 15px; background: #161c33; border: 1px solid #2a345c; border-radius: 8px; cursor: pointer; text-align: right; color: #ccc; transition: 0.2s; outline: none; }
    .cat-item.active, .cat-item:focus { background: #1f2747; border-color: #ffde03; color: #ffde03; font-weight: bold; }

    /* ٢. بەشی ناوەڕاست: کەناڵەکان (Channels) */
    .channels { width: 280px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    .channel-item { display: flex; align-items: center; justify-content: flex-start; gap: 15px; padding: 12px 15px; background: #161c33; border: 1px solid #2a345c; border-radius: 8px; cursor: pointer; transition: 0.2s; outline: none; }
    .channel-item.active, .channel-item:focus { background: #1f2747; border-color: #ffde03; color: #ffde03; }
    
    /* ٣. بەشی چەپ: شاشەی پریڤیو (Video Preview) */
    .preview-section { flex: 1; display: flex; flex-direction: column; }
    .video-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative; border: 2px solid transparent; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .video-container video { width: 100%; height: 100%; object-fit: contain; }
    .channel-title { font-size: 28px; font-weight: bold; margin-top: 20px; text-align: right; }

    /* Footer (خوارەوە) */
    .footer { height: 40px; display: flex; align-items: center; justify-content: flex-end; gap: 25px; padding: 0 30px; font-size: 14px; color: #888; }
    .footer span { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .footer span:hover { color: #ffde03; }

    /* Scrollbar Styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b1021; }
    ::-webkit-scrollbar-thumb { background: #2a345c; border-radius: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">REBAZ TV ‹</div>
    
    <div class="header-left">
      <div class="header-icons">
        <span>⚙️</span>
        <span>🎬</span>
        <span>📺</span>
      </div>
      <div class="search-box">
        <input type="text" placeholder="گەڕان...">
        <span>🔍</span>
      </div>
    </div>
  </div>

  <div class="main-content">
    
    <div class="categories" id="categoryList">
      <div class="cat-item active" tabindex="0" data-cat="all">هەموو کەناڵەکان</div>
      <div class="cat-item" tabindex="0" data-cat="news">هەواڵ</div>
      <div class="cat-item" tabindex="0" data-cat="local">کوردی ناوخۆیی</div>
      <div class="cat-item" tabindex="0" data-cat="sports">وەرزش</div>
      <div class="cat-item" tabindex="0" data-cat="doc">دۆکیۆمێنتاری</div>
    </div>

    <div class="channels" id="channelList">
      </div>

    <div class="preview-section">
      <div class="video-container" id="videoContainer">
        <video id="videoPlayer" autoplay></video>
      </div>
      <div class="channel-title" id="currentChannelTitle">ناوی کەناڵ</div>
    </div>

  </div>

  <div class="footer">
    <span id="externalPlayBtn">▷ پەخشی دەرەکی</span>
    <span>🕒 لە ئەرشیف</span>
    <span>♡ دڵخوازەکان</span>
  </div>

  <script>
    const channels = [
      { id: 1, name: "Shna Documentary", cat: "doc", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
      { id: 2, name: "K24 Documentary", cat: "doc", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
      { id: 3, name: "Astera Documentary", cat: "doc", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
      { id: 4, name: "Kurdbin-KURDsat", cat: "local", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
      { id: 5, name: "Reng Documentary", cat: "doc", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }
    ];

    const video = document.getElementById('videoPlayer');
    const channelListEl = document.getElementById('channelList');
    const currentChannelTitle = document.getElementById('currentChannelTitle');
    const externalPlayBtn = document.getElementById('externalPlayBtn');
    
    let hls = null;
    let activeChannel = null;
    let currentCategory = 'all';

    function renderChannels() {
      channelListEl.innerHTML = '';
      let filtered = channels;
      if (currentCategory !== 'all') {
        filtered = channels.filter(c => c.cat === currentCategory);
      }

      filtered.forEach(ch => {
        const item = document.createElement('div');
        item.className = `channel-item ${activeChannel && ch.id === activeChannel.id ? 'active' : ''}`;
        item.tabIndex = 0;
        item.innerHTML = `<span>${ch.name}</span>`;
        
        item.onclick = () => handleChannelSelect(ch, item);
        item.onkeydown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            // ئەگەر دووەم جار لەسەر هەمان کەناڵ OK داگیرا، ڕاستەوخۆ دەچێتە پلەری دەرەکی
            if (activeChannel && activeChannel.id === ch.id) {
              openExternalPlayer();
            } else {
              handleChannelSelect(ch, item);
            }
          }
        };
        channelListEl.appendChild(item);
      });
    }

    document.querySelectorAll('.cat-item').forEach(catEl => {
      const selectCat = () => {
        document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
        catEl.classList.add('active');
        currentCategory = catEl.getAttribute('data-cat');
        renderChannels();
      };
      catEl.onclick = selectCat;
      catEl.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); selectCat(); } };
    });

    function handleChannelSelect(channel, element) {
      activeChannel = channel;
      currentChannelTitle.textContent = channel.name;
      
      document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
      if (element) {
        element.classList.add('active');
        element.focus();
      }

      // لێدان لە شاشەی پریڤیو (بێ کێشە)
      if (Hls.isSupported()) {
        if (hls) {
          hls.destroy();
        }
        hls = new Hls({ maxBufferLength: 30 });
        hls.loadSource(channel.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(e => console.log(e));
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = channel.url;
        video.play();
      }
    }

    // کردنەوەی پلەری دەرەکی (VLC/Exo) بە بێ کێشەی دەبڵ شاشە
    function openExternalPlayer() {
      if (!activeChannel) return;

      // ١. کوژاندنەوە و لەناوبردنی تەواوی ڤیدیۆی پریڤیو لە وێبەکەدا
      if (hls) {
        hls.destroy();
        hls = null;
      }
      video.pause();
      video.removeAttribute('src');
      video.load();

      // ٢. بانگکردنی پلەری دەرەکی ئەپەکە
      if (window.AndroidBridge && window.AndroidBridge.playInExo) {
        window.AndroidBridge.playInExo(activeChannel.url, activeChannel.name);
      } else {
        console.log("External Player triggered for:", activeChannel.url);
      }
    }

    // بەستنەوەی دوگمەی پەخشی دەرەکی لە فوتەر
    externalPlayBtn.onclick = openExternalPlayer;
    externalPlayBtn.tabIndex = 0;
    externalPlayBtn.onkeydown = (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        openExternalPlayer();
      }
    };

    // کارپێکردنی یەکەم کەناڵ لە پریڤیو لە سەرەتادا
    if (channels.length > 0) {
      renderChannels();
      handleChannelSelect(channels[0], document.querySelector('.channel-item'));
    }
  </script>
</body>
</html>
