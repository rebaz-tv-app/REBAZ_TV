<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBAZ TV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #1a1625; --border-color: rgba(255, 255, 255, 0.2); --highlight-yellow: #facc15; --text-main: #ffffff; --text-muted: #a09eb0; --item-bg: rgba(255, 255, 255, 0.05); --item-focus-bg: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .main-content { display: flex; flex: 1; height: 100vh; }
        .col { padding: 20px; overflow-y: auto; }
        .col-categories { width: 25%; border-right: 1px solid var(--border-color); }
        .col-channels { width: 35%; border-right: 1px solid var(--border-color); }
        .col-preview { width: 40%; padding: 25px; }

        .list-header { padding: 15px; border: 1px solid white; margin-bottom: 10px; border-radius: 4px; }
        .list-item { display: flex; align-items: center; padding: 16px 15px; margin-bottom: 6px; background: var(--item-bg); border: 2px solid transparent; cursor: pointer; border-radius: 4px; }
        .list-item:focus { border-color: white; background: var(--item-focus-bg); outline: none; }
        
        .channel-num { font-size: 18px; width: 30px; }
        .channel-icon { font-size: 18px; color: white; background: white; color: var(--bg-color); padding: 4px; border-radius: 4px; margin-right: 10px; }
    </style>
</head>
<body>

    <div class="main-content">
        <!-- بەشی جۆرەکان -->
        <div class="col col-categories">
            <div class="list-header">Live TV Categories</div>
            <div class="list-item" tabindex="0">All Channels</div>
        </div>

        <!-- بەشی کەناڵەکان -->
        <div class="col col-channels" id="channel-list">
            <div class="list-item">بارکردنی کەناڵەکان...</div>
        </div>

        <!-- بەشی لێدان -->
        <div class="col col-preview">
            <div style="width:100%; aspect-ratio:16/9; background:#000; border-radius:8px;"></div>
            <h2 id="channel-title" style="margin-top:20px;">هیچ کەناڵێک هەڵنەبژێردراوە</h2>
        </div>
    </div>

    <script>
        // لینکی پلەی لیستەکەت
        const M3U_URL = "https://raw.githubusercontent.com/rebaz92/Xurmatw/refs/heads/main/xurmatw";

        async function loadChannels() {
            try {
                const response = await fetch(M3U_URL);
                const data = await response.text();
                const lines = data.split('\n');
                const listContainer = document.getElementById('channel-list');
                listContainer.innerHTML = ''; 

                let count = 1;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF:')) {
                        let name = lines[i].split(',')[1] || "کەناڵ";
                        let url = lines[i+1] || "";

                        let div = document.createElement('div');
                        div.className = 'list-item';
                        div.tabIndex = 0;
                        div.innerHTML = `<span class="channel-num">${count}</span><i class="fa-solid fa-tv channel-icon"></i><span>${name}</span>`;
                        
                        div.onclick = () => {
                            document.getElementById('channel-title').innerText = count + ". " + name;
                            if (typeof AndroidBridge !== 'undefined') {
                                AndroidBridge.playInExo(url, name);
                            }
                        };
                        
                        listContainer.appendChild(div);
                        count++;
                    }
                }
            } catch (e) {
                document.getElementById('channel-list').innerHTML = '<div class="list-item">هەڵە لە بارکردنی لیستەکە</div>';
            }
        }

        window.onload = loadChannels;
    </script>
</body>
</html>
