name: Build REBAZ TV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android Project for REBAZ TV
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/rebaz/rebaztvnew
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/drawable
        
        cat << 'EOF' > app/src/main/res/drawable/ic_close.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M19,6.41L17.59,5 12,10.59 6.41,5 5,6.41 10.59,12 5,17.59 6.41,19 12,13.41 17.59,19 19,17.59 13.41,12z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_fullscreen.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M7,14H5v5h5v-2H7V14z M5,10h2V7h3V5H5V10z M17,17h-3v2h5v-5h-2V17z M14,5v2h3v3h2V5H14z"/>
        </vector>
        EOF
        
        if [ -f "splash.png" ]; then cp splash.png app/src/main/res/drawable/splash_img.png
        elif [ -f "splash.jpg" ]; then cp splash.jpg app/src/main/res/drawable/splash_img.png
        elif [ -f "logo.png" ]; then cp logo.png app/src/main/res/drawable/splash_img.png
        elif [ -f "logo.jpg" ]; then cp logo.jpg app/src/main/res/drawable/splash_img.png
        else curl -L -o app/src/main/res/drawable/splash_img.png "https://upload.wikimedia.org/wikipedia/commons/c/cf/ExoPlayer_logo.png"; fi

        if [ -f "logo.png" ]; then cp logo.png app/src/main/res/drawable/ic_launcher.png
        elif [ -f "logo.jpg" ]; then cp logo.jpg app/src/main/res/drawable/ic_launcher.png
        else curl -L -o app/src/main/res/drawable/ic_launcher.png "https://upload.wikimedia.org/wikipedia/commons/c/cf/ExoPlayer_logo.png"; fi
        
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF
        
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.rebaz.rebaztvnew'
            compileSdk 34
            defaultConfig {
                applicationId "com.rebaz.rebaztvnew"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.media3:media3-exoplayer:1.2.1'
            implementation 'androidx.media3:media3-ui:1.2.1'
            implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
        }
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#0A0E17">

            <FrameLayout
                android:id="@+id/player_container"
                android:layout_width="match_parent"
                android:layout_height="240dp"
                android:layout_alignParentTop="true"
                android:visibility="gone"
                android:background="#000000">

                <androidx.media3.ui.PlayerView
                    android:id="@+id/exo_player_view"
                    android:layout_width="match_parent"
                    android:layout_height="match_parent"
                    app:use_controller="false"
                    app:resize_mode="fit"/>

                <include layout="@layout/custom_exo_controls" />
            </FrameLayout>
            
            <WebView
                android:id="@+id/main_web_view"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:layout_below="@id/player_container"
                android:background="@android:color/transparent"
                android:focusable="true"/>

            <RelativeLayout
                android:id="@+id/splash_screen"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:background="#0A0E17"
                android:elevation="30dp"
                android:gravity="center">

                <ImageView
                    android:layout_width="match_parent"
                    android:layout_height="match_parent"
                    android:scaleType="centerCrop"
                    android:src="@drawable/splash_img" />
            </RelativeLayout>
        </RelativeLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/custom_exo_controls.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#00000000">
            
            <ImageButton 
                android:id="@+id/custom_close_btn" 
                android:layout_width="50dp" 
                android:layout_height="50dp" 
                android:layout_alignParentTop="true" 
                android:layout_alignParentEnd="true" 
                android:layout_marginTop="12dp" 
                android:layout_marginEnd="12dp" 
                android:background="@android:color/transparent" 
                android:src="@drawable/ic_close" 
                android:tint="#EF4444"
                android:focusable="true"
                android:nextFocusDown="@+id/exo_fullscreen" />
                
            <ImageButton 
                android:id="@+id/exo_fullscreen" 
                android:layout_width="50dp" 
                android:layout_height="50dp" 
                android:layout_alignParentBottom="true" 
                android:layout_alignParentStart="true" 
                android:layout_marginStart="12dp" 
                android:layout_marginBottom="12dp" 
                android:background="@android:color/transparent" 
                android:src="@drawable/ic_fullscreen" 
                android:tint="#FFFFFF"
                android:focusable="true"
                android:nextFocusUp="@+id/custom_close_btn" />
        </RelativeLayout>
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
            <uses-feature android:name="android.software.leanback" android:required="false" />

            <application android:allowBackup="true" android:label="REBAZ TV APP" android:icon="@drawable/ic_launcher" android:theme="@style/Theme.AppCompat.Light.NoActionBar" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
                <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden|layoutDirection">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                        <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat << 'EOF' > app/src/main/java/com/rebaz/rebaztvnew/MainActivity.java
        package com.rebaz.rebaztvnew;
        import android.content.pm.ActivityInfo;
        import android.graphics.Color;
        import android.os.Bundle;
        import android.os.Handler;
        import android.os.Looper;
        import android.view.View;
        import android.view.ViewGroup;
        import android.view.WindowManager;
        import android.webkit.JavascriptInterface;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.widget.FrameLayout; 
        import android.widget.RelativeLayout; 
        import androidx.appcompat.app.AppCompatActivity;
        
        import androidx.media3.common.MediaItem;
        import androidx.media3.common.PlaybackException;
        import androidx.media3.common.Player;
        import androidx.media3.exoplayer.ExoPlayer;
        import androidx.media3.ui.PlayerView;

        public class MainActivity extends AppCompatActivity {
            private WebView wv;
            private ExoPlayer player;
            private PlayerView playerView;
            private FrameLayout playerContainer; 
            private View splashScreen;
            private boolean isFullscreen = false;
            
            private Handler timeoutHandler = new Handler(Looper.getMainLooper());
            private String fallbackUrl = "";

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                playerContainer = findViewById(R.id.player_container);
                playerView = findViewById(R.id.exo_player_view);
                wv = findViewById(R.id.main_web_view);
                splashScreen = findViewById(R.id.splash_screen);

                wv.setBackgroundColor(Color.TRANSPARENT);

                new Handler(Looper.getMainLooper()).postDelayed(() -> {
                    if (splashScreen != null) {
                        splashScreen.setVisibility(View.GONE);
                        wv.requestFocus();
                    }
                }, 3000);

                player = new ExoPlayer.Builder(this).build();
                playerView.setPlayer(player);
                
                player.addListener(new Player.Listener() {
                    @Override
                    public void onPlaybackStateChanged(int playbackState) {
                        if (playbackState == Player.STATE_READY) {
                            timeoutHandler.removeCallbacksAndMessages(null); 
                        }
                    }

                    @Override
                    public void onPlayerError(PlaybackException error) {
                        timeoutHandler.removeCallbacksAndMessages(null);
                        triggerFallback();
                    }
                });

                View closeBtn = findViewById(R.id.custom_close_btn);
                if (closeBtn != null) closeBtn.setOnClickListener(v -> stopAndHidePlayer());
                
                View fullscreenBtn = findViewById(R.id.exo_fullscreen);
                if (fullscreenBtn != null) fullscreenBtn.setOnClickListener(v -> toggleFullscreen(!isFullscreen));

                initWebViewAndLoad();
            }

            private void initWebViewAndLoad() {
                WebSettings ws = wv.getSettings();
                ws.setJavaScriptEnabled(true); 
                ws.setDomStorageEnabled(true); 
                ws.setCacheMode(WebSettings.LOAD_NO_CACHE);
                wv.clearCache(true);
                
                wv.addJavascriptInterface(new Object() {
                    
                    @JavascriptInterface
                    public void playInExo(final String url1, final String url2, final String name) {
                        runOnUiThread(() -> {
                            fallbackUrl = url2;
                            startPlayback(url1, true);
                        });
                    }

                    @JavascriptInterface
                    public void playInExo(final String url, final String name) {
                        runOnUiThread(() -> {
                            fallbackUrl = ""; 
                            startPlayback(url, true);
                        });
                    }
                }, "AndroidBridge");

                wv.setWebViewClient(new WebViewClient());
                wv.setWebChromeClient(new WebChromeClient());
                wv.loadUrl("https://rebaz92.github.io/REBAZ_TV/index.html"); 
            }

            private void startPlayback(String url, boolean isFirstLink) {
                if (url == null || url.isEmpty()) return;
                
                getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                int heightPx = (int) (240 * getResources().getDisplayMetrics().density);
                RelativeLayout.LayoutParams params = new RelativeLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, heightPx);
                params.addRule(RelativeLayout.ALIGN_PARENT_TOP);
                playerContainer.setLayoutParams(params);
                playerContainer.setVisibility(View.VISIBLE);
                
                player.setMediaItem(MediaItem.fromUri(url));
                player.prepare();
                player.play();

                timeoutHandler.removeCallbacksAndMessages(null);
                
                if (isFirstLink && fallbackUrl != null && !fallbackUrl.isEmpty()) {
                    timeoutHandler.postDelayed(() -> {
                        triggerFallback();
                    }, 10000); 
                }
            }
            
            private void triggerFallback() {
                if (fallbackUrl != null && !fallbackUrl.isEmpty()) {
                    String tempUrl = fallbackUrl;
                    fallbackUrl = ""; 
                    startPlayback(tempUrl, false);
                }
            }

            private void stopAndHidePlayer() {
                if (player != null) { 
                    player.stop();
                    player.clearMediaItems();
                }
                timeoutHandler.removeCallbacksAndMessages(null);
                playerContainer.setVisibility(View.GONE);
                getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                wv.requestFocus();
                
                if (isFullscreen) {
                    setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                    getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                    isFullscreen = false;
                }
            }

            private void toggleFullscreen(boolean fullscreen) {
                isFullscreen = fullscreen;
                if (fullscreen) {
                    setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                    getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                    playerContainer.setLayoutParams(new RelativeLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                } else {
                    setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                    getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                    int heightPx = (int) (240 * getResources().getDisplayMetrics().density);
                    RelativeLayout.LayoutParams params = new RelativeLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, heightPx);
                    params.addRule(RelativeLayout.ALIGN_PARENT_TOP);
                    playerContainer.setLayoutParams(params);
                }
            }

            @Override public void onBackPressed() {
                if (isFullscreen) stopAndHidePlayer();
                else if (playerContainer.getVisibility() == View.VISIBLE) stopAndHidePlayer();
                else super.onBackPressed();
            }

            @Override
            protected void onDestroy() {
                super.onDestroy();
                if (player != null) {
                    player.release();
                }
                timeoutHandler.removeCallbacksAndMessages(null);
            }
        }
        EOF
        
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Build REBAZ TV APK
      run: |
        ./gradlew assembleDebug --stacktrace
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/rebaz.tv.new.apk

    - name: Upload Finished REBAZ TV APK
      uses: actions/upload-artifact@v4
      with:
        name: REBAZ-TV-APK
        path: app/build/outputs/apk/debug/rebaz.tv.new.apk
