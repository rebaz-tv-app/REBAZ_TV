name: Build REBAZ TV Smart App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Build APK
      run: |
        mkdir -p app/src/main/java/com/rebaz/tvsmart
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/AndroidManifest.xml
        
        # دروستکردنی فایلی MainActivity.java کە WebView Load دەکات
        cat << 'EOF' > app/src/main/java/com/rebaz/tvsmart/MainActivity.java
        package com.rebaz.tvsmart;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView wv = new WebView(this);
                setContentView(wv);
                WebSettings ws = wv.getSettings();
                ws.setJavaScriptEnabled(true);
                ws.setDomStorageEnabled(true);
                ws.setMediaPlaybackRequiresUserGesture(false);
                wv.setWebViewClient(new WebViewClient());
                // لێرەدا لینکی فایلی smart.htmlـەکەت دابنێ
                wv.loadUrl("https://rebaz-tv-app.github.io/REBAZ_TV/smart.html");
            }
        }
        EOF

        # دروستکردنی AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.rebaz.tvsmart">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:allowBackup="true" android:label="REBAZ TV Smart" android:usesCleartextTraffic="true">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # لێرەدا دەبێت build.gradle و فایلەکانی تر دابنێیت (وەک پێشتر)
        # پاشان ./gradlew assembleDebug
        # ئەم بەشە تەنها بۆ نموونەیە، بۆیە دڵنیابە لە تەواوکردنی فایلە پێویستەکانی تر.
