name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create App
        run: |
          cordova create rebaz_app com.rebaztv.live "REBAZ TV"
          rm -rf rebaz_app/www/*
          cp index.html rebaz_app/www/
          
          # ئەم بەشە نوێیەیە بۆ ئەوەی ڕێگە لە کاش بگرێت
          cat << 'EOF' > rebaz_app/config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.rebaztv.live" version="1.0.0" xmlns="http://www.w3.org/ns/widgets">
              <name>REBAZ TV</name>
              <access origin="*" />
              <allow-intent href="*" />
              <preference name="ClearCacheMode" value="all" />
              <preference name="AppendUserAgent" value="RebazTVApp" />
          </widget>
          EOF

      - name: Build APK
        working-directory: ./rebaz_app
        run: |
          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REBAZ-TV-App
          path: rebaz_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
