name: Build REBAZ TV Smart APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Android SDK & Build
      uses: android-actions/setup-android@v3

    - name: Create Project Files
      run: |
        mkdir -p app/src/main/java/com/rebazsmart/tv
        mkdir -p app/src/main/res/values

        # AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.rebazsmart.tv">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:allowBackup="true" android:label="REBAZ TV" android:usesCleartextTraffic="true">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Strings.xml
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">REBAZ TV</string>
        </resources>
        EOF

        # MainActivity.java (لێرەدا ڕاستەوخۆ دەچێتە سەر index.html)
        cat << 'EOF' > app/src/main/java/com/rebazsmart/tv/MainActivity.java
        package com.rebazsmart.tv;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView wv = new WebView(this);
                WebSettings ws = wv.getSettings();
                ws.setJavaScriptEnabled(true);
                ws.setDomStorageEnabled(true);
                ws.setMediaPlaybackRequiresUserGesture(false);
                wv.setWebViewClient(new WebViewClient());
                wv.loadUrl("https://rebaz-tv-app.github.io/REBAZ_TV/");
                setContentView(wv);
            }
        }
        EOF

        # settings.gradle
        echo "include ':app'" > settings.gradle

        # build.gradle (Project level)
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # build.gradle (App level)
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.rebazsmart.tv'
            compileSdk 34
            defaultConfig {
                applicationId "com.rebazsmart.tv"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # gradle.properties
        echo "android.useAndroidX=true" > gradle.properties

        # Gradle Wrapper initialization
        gradle wrapper
        chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: rebaz_smart_tv
        path: app/build/outputs/apk/debug/app-debug.apk
